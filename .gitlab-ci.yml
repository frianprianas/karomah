
stages:
  - deploy

deploy_job:
  stage: deploy
  image: ubuntu:latest
  only:
    - main
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - ssh -p ${SERVER_PORT:-2290} $SERVER_USER@$SERVER_IP "cd $DEPLOY_PATH && bash update.sh"
